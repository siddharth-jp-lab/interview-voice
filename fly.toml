# fly.toml app configuration file generated for interview-voice-sjp on 2026-11-01T00:57:40+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'interview-voice-sjp'
primary_region = 'sin'

[build]

[env]
  DATABASE_PATH = "/data/interview.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "interview_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
